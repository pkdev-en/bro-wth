<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trang cá nhân{% endblock %}</title>
    
    <!-- Nhúng file style.css thông qua url_for của Jinja2 -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Thanh điều hướng dùng chung -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">pkdev<span>.</span></a>
            <div class="nav-links">
                <a href="/">Giới thiệu</a>
                <a href="#skills">Kỹ năng</a>
                <a href="/contact">Liên hệ</a>
            </div>
        </div>
    </nav>

    <!-- Nội dung thay đổi tùy theo từng trang con -->
    <main>
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
