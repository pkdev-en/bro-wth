name: Build Blender iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          repository: HoloMoto/Blender_for_AppleVisionPro
          ref: ios
          lfs: true
          fetch-depth: 0
          path: Blender

      - name: Install tools
        run: |
          brew update
          brew install cmake ninja git-lfs python
          git lfs install

      - name: Download Blender source deps (datafiles etc, libs skipped)
        working-directory: Blender
        run: |
          make update

      - name: Fetch precompiled macOS libs from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Blender/lib
          gh release download blender-libs-macos-arm64 \
            --repo "${{ github.repository }}" \
            --pattern "macos_arm64_libs.tar.gz" \
            --output macos_arm64_libs.tar.gz
          tar -xzf macos_arm64_libs.tar.gz -C Blender/lib
          test -d Blender/lib/macos_arm64/python || \
            (echo "Lib extraction failed, python dir missing" && exit 1)

      - name: Build host tools
        run: |
          mkdir -p build_darwin_clean
          cd build_darwin_clean

          cmake ../Blender \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPPLE_TARGET_DEVICE=macos

          cmake --build . \
            --target makesdna \
            --target makesrna \
            --target datatoc \
            --target glsl_preprocess \
            -j$(sysctl -n hw.ncpu)

      - name: Configure iOS
        working-directory: Blender
        run: |
          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DAPPLE_TARGET_DEVICE=ios \
            -DBLENDER_IOS_HOST_TOOLS_DIR=$(pwd)/../build_darwin_clean/bin

      - name: Build
        working-directory: Blender
        run: |
          cmake --build build_ios \
            --config Release \
            --target blender \
            -j$(sysctl -n hw.ncpu)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Blender.app
          path: Blender/build_ios/bin/Release
      - name: Package unsigned IPA
        run: |
          cd Blender/build_ios/bin/Release
          mkdir -p Payload
          cp -R Blender.app Payload/
          zip -r -y Blender.ipa Payload
          mv Blender.ipa "$GITHUB_WORKSPACE/Blender.ipa"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Blender-ipa
          path: Blender.ipa
