name: Bootstrap Blender macOS Libs

on:
  workflow_dispatch:

jobs:
  build-libs:
    runs-on: macos-15

    steps:
      - name: Checkout upstream Blender (for submodule-based lib fetch)
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: main
          lfs: true
          fetch-depth: 0
          path: blender_upstream

      - name: Install tools
        run: |
          brew update
          brew install cmake ninja git-lfs python
          git lfs install

      - name: Fetch precompiled libraries via make update
        working-directory: blender_upstream
        run: |
          make update

      - name: Verify libs populated
        run: |
          test -d blender_upstream/lib/macos_arm64/python || \
            (echo "macos_arm64 libs missing after make update" && exit 1)
          ls -la blender_upstream/lib/

      - name: Archive libraries
        run: |
          tar -czf macos_arm64_libs.tar.gz -C blender_upstream/lib macos_arm64
          ls -lh macos_arm64_libs.tar.gz

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos_arm64_libs
          path: macos_arm64_libs.tar.gz
          retention-days: 90

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete blender-libs-macos-arm64 --yes --repo "${{ github.repository }}" || true
          gh release create blender-libs-macos-arm64 macos_arm64_libs.tar.gz \
            --repo "${{ github.repository }}" \
            --title "Blender macOS arm64 precompiled libs" \
            --notes "Auto-built by bootstrap workflow. Consumed by the main iOS build workflow."
