name: Build Unsigned Blender iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: ios
          lfs: false

      - name: Setup Homebrew & Tools
        run: |
          brew install cmake

      - name: Fetch Dependencies
        run: |
          python3 ./build_files/utils/make_update.py --use-ios-libraries

      - name: Generate Xcode Project with CMake
        run: |
          cmake -G Xcode -S . -B build_ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DPYTHON_VERSION=3.13

      - name: Build Unsigned Application
        run: |
          xcodebuild -project build_ios/Blender.xcodeproj \
                    -scheme Blender \
                    -configuration Release \
                    -sdk iphoneos \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO \
                    build

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build_ios/Release-iphoneos/Blender.app Payload/
          zip -r Blender-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-Unsigned-IPA
          path: Blender-Unsigned.ipa
