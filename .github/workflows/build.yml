name: Build Blender iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          repository: HoloMoto/Blender_for_AppleVisionPro
          ref: ios
          lfs: true
          fetch-depth: 0

      - name: Install tools
        run: |
          brew update
          brew install cmake ninja git-lfs python

          git lfs install

      - name: Download Blender libraries
        run: |
          make update

      - name: Build host tools
        run: |
          mkdir ../build_host
          cd ../build_host

          cmake ../Blender \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . \
            --target datatoc \
            --target glsl_preprocess \
            -j$(sysctl -n hw.ncpu)

      - name: Configure iOS
        run: |
          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DAPPLE_TARGET_DEVICE=ios \
            -DBLENDER_IOS_HOST_TOOLS_DIR=$(pwd)/../build_host/bin

      - name: Build
        run: |
          cmake --build build_ios \
            --config Release \
            --target blender \
            -j$(sysctl -n hw.ncpu)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Blender.app
          path: build_ios/bin/Release
